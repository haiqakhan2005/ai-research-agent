[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "AI research agent backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]==0.141.1",
    "slowapi==0.1.10",
    "pillow==12.3.0",
    "pytz",
    "smolagents==1.26.0",
    "python-dotenv==1.2.3",
    "ddgs==9.15.0"
]

[tool.setuptools]
py-modules = []

[tool.fastapi]
entrypoint = "api.index:app"